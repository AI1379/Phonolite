[project]
name = "audio-core"
version = "0.1.0"
description = "Real-time audio DSP and pitch utilities (STFT, peaks, chroma, pitch grid, note naming) — the Workbench's future MIR backend"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Phonolite Project" }]
keywords = ["audio", "fft", "pitch", "spectrum", "dsp"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_core"]
