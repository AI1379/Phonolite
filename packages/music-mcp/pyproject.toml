[project]
name = "music-mcp"
version = "0.1.0"
description = "MCP tools that proxy the Music Agent Workbench Domain API"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Phonolite Project" }]
dependencies = [
    "httpx>=0.28",
    "mcp>=1.20,<2",
]

[project.scripts]
music-mcp = "music_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_mcp"]
