[project]
name = "memory-core"
version = "0.1.0"
description = "Host-independent event-sourced memory and learning state for Music Agent Workbench"
readme = "../../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Phonolite Project" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_core"]
