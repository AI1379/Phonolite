[project]
name = "agent-runtime"
version = "0.1.0"
description = "Host-neutral agent runtime protocol and OpenCode adapter"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Phonolite Project" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
