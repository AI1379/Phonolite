[project]
name = "phonolite"
version = "0.1.0"
description = "Real-time microphone spectrum analysis and pitch exploration — a tuner-like tool for natural sounds"
readme = "../../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Phonolite Project" }]
keywords = ["audio", "fft", "pitch", "spectrum", "tuner", "dsp", "pyqt"]
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pyqtgraph>=0.13",
    "audio-core",
]

[project.optional-dependencies]
ml = [
    # Phase 3 will add torch / onnxruntime here
]

[project.scripts]
phonolite = "phonolite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonolite"]

[tool.uv.sources]
audio-core = { workspace = true }
