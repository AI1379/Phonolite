[project]
name = "workbench-server"
version = "0.1.0"
description = "FastAPI application layer for the Music Agent Workbench (Domain API / WebSocket)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Phonolite Project" }]
dependencies = [
    "agent-runtime",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "music-core",
    "memory-core",
    "audio-core",
    "soundfile>=0.13",
]

[project.scripts]
workbench-server = "workbench_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_server"]

[tool.uv.sources]
agent-runtime = { workspace = true }
music-core = { workspace = true }
memory-core = { workspace = true }
audio-core = { workspace = true }
